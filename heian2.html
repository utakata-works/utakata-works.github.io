<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平安沼リーダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --washi:#EDE7D6;
    --washi-deep:#E3DAC3;
    --sumi:#2B2620;
    --aka:#8C3B2E;
    --ai:#33415C;
    --moss:#5B6B4F;
    --line:#C9BFA3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--washi);
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.4), transparent 60%),
      radial-gradient(ellipse at 90% 100%, rgba(0,0,0,0.03), transparent 60%);
    color:var(--sumi);
    font-family:"Noto Sans JP", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  header{
    padding:22px 18px 14px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0;
    background:var(--washi);
    z-index:10;
  }
  h1{
    font-family:"Shippori Mincho", serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 2px;
    letter-spacing:0.04em;
  }
  .sub{
    font-size:12px;
    color:var(--sumi);
    opacity:0.55;
    letter-spacing:0.02em;
  }
  .searchbar{
    margin-top:14px;
    display:flex;
    gap:8px;
  }
  .searchbar input{
    flex:1;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    font-size:15px;
    font-family:inherit;
  }
  .searchbar input:focus{
    outline:2px solid var(--ai);
    outline-offset:1px;
  }
  .cats{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:14px 18px 4px;
    scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none;}
  .cat-btn{
    flex:0 0 auto;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--sumi);
    background:transparent;
    color:var(--sumi);
    font-family:"Shippori Mincho", serif;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
  }
  .cat-btn.active{
    background:var(--sumi);
    color:var(--washi);
  }
  main{
    padding:12px 18px 100px;
    max-width:640px;
    margin:0 auto;
  }
  .entry{
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .entry-head{
    padding:13px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    gap:10px;
  }
  .entry-titles{flex:1; min-width:0;}
  .entry-tag{
    display:inline-block;
    font-size:10px;
    color:var(--aka);
    border:1px solid var(--aka);
    border-radius:3px;
    padding:1px 6px;
    margin-bottom:4px;
    font-family:"Shippori Mincho", serif;
  }
  .entry-title{
    font-family:"Shippori Mincho", serif;
    font-weight:700;
    font-size:16px;
    line-height:1.4;
  }
  .entry-preview{
    font-size:12px;
    color:var(--sumi);
    opacity:0.55;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chevron{
    width:18px; height:18px;
    flex:0 0 auto;
    transition:transform 0.2s ease;
    opacity:0.5;
  }
  .entry.open .chevron{transform:rotate(180deg);}
  .entry-body{
    display:none;
    padding:0 14px 16px;
    border-top:1px solid var(--washi-deep);
  }
  .entry.open .entry-body{display:block;}
  .entry-text{
    font-size:14.5px;
    line-height:1.9;
    white-space:pre-wrap;
    padding-top:12px;
    color:#3a342c;
  }
  .entry-controls{
    display:flex;
    gap:8px;
    margin-top:12px;
    flex-wrap:wrap;
  }
  .ctl-btn{
    padding:8px 14px;
    border-radius:6px;
    border:1px solid var(--sumi);
    background:transparent;
    color:var(--sumi);
    font-size:13px;
    font-family:"Noto Sans JP", sans-serif;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .ctl-btn.playing{
    background:var(--aka);
    border-color:var(--aka);
    color:#fff;
  }
  .ctl-btn:disabled{opacity:0.35; cursor:default;}
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--sumi);
    opacity:0.5;
    font-size:14px;
  }
  .fab-group{
    position:fixed;
    right:18px; bottom:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    z-index:20;
  }
  .fab{
    width:56px; height:56px;
    border-radius:50%;
    background:var(--sumi);
    color:var(--washi);
    border:none;
    font-size:28px;
    line-height:1;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    cursor:pointer;
  }
  .fab-secondary{
    width:44px; height:44px;
    font-size:18px;
    background:var(--ai);
    color:#fff;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
  }
  .modal-back{
    position:fixed; inset:0;
    background:rgba(20,17,12,0.5);
    display:none;
    align-items:flex-end;
    z-index:30;
  }
  .modal-back.show{display:flex;}
  .modal{
    background:var(--washi);
    width:100%;
    border-radius:16px 16px 0 0;
    padding:20px 18px 28px;
    max-height:85vh;
    overflow-y:auto;
  }
  .modal h2{
    font-family:"Shippori Mincho", serif;
    font-size:18px;
    margin:0 0 14px;
  }
  .modal label{
    display:block;
    font-size:12px;
    color:var(--sumi);
    opacity:0.6;
    margin:12px 0 5px;
  }
  .modal input, .modal select, .modal textarea{
    width:100%;
    padding:10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-family:inherit;
    font-size:14px;
    background:#fff;
  }
  .modal textarea{
    min-height:120px;
    resize:vertical;
  }
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .modal-actions button{
    flex:1;
    padding:12px;
    border-radius:8px;
    border:none;
    font-size:14px;
    font-family:"Shippori Mincho", serif;
    font-weight:700;
    cursor:pointer;
  }
  .btn-cancel{background:transparent; border:1px solid var(--sumi) !important; color:var(--sumi);}
  .btn-save{background:var(--aka); color:#fff;}
  .status{
    font-size:11px;
    text-align:center;
    padding:6px;
    opacity:0.5;
  }
  .del-btn{
    margin-left:auto;
    background:transparent;
    border:none;
    color:var(--sumi);
    opacity:0.4;
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
  }
</style>
</head>
<body>

<header>
  <h1>平安沼リーダー</h1>
  <div class="sub">検索して、読んで、読み上げる</div>
  <div class="searchbar">
    <input id="search" type="text" placeholder="キーワードで検索（例：蘇我、崇仏、称制）" autocomplete="off">
  </div>
</header>

<div class="cats" id="cats"></div>

<main id="list"></main>

<div class="fab-group">
  <button class="fab fab-secondary" id="importBtn" title="URLから読み込む">⇩</button>
  <button class="fab" id="addBtn" title="追加">＋</button>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <h2>新しいメモを追加</h2>
    <label>カテゴリ</label>
    <input id="m-cat" type="text" placeholder="例：蘇我氏">
    <label>タイトル</label>
    <input id="m-title" type="text" placeholder="例：崇仏論争の展開">
    <label>本文</label>
    <textarea id="m-body" placeholder="ここに内容を書いてください"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">キャンセル</button>
      <button class="btn-save" id="saveBtn">保存</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<div class="modal-back" id="importBack">
  <div class="modal">
    <h2>GitHubのRaw URLから読み込む</h2>
    <div style="font-size:12.5px; opacity:0.6; line-height:1.6; margin-bottom:10px;">
      GitHubでファイルを開き「Raw」ボタンを押した時のURL（raw.githubusercontent.com/...）を貼ってください。<br>
      見出し（##）ごとにカテゴリ分けし、「**Q.」「A.」のペアを自動で1件ずつのメモに分割します。
    </div>
    <label>Raw URL</label>
    <input id="import-url" type="url" placeholder="https://raw.githubusercontent.com/...">
    <div class="modal-actions">
      <button class="btn-cancel" id="importCancelBtn">キャンセル</button>
      <button class="btn-save" id="importGoBtn">読み込む</button>
    </div>
    <div class="status" id="importStatus"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'heian_reader_entries_v1';
let entries = [];
let activeCat = 'すべて';
let currentUtterance = null;
let speakingId = null;

const seed = [
  {
    id: 's1', category: '蘇我氏',
    title: '蘇我氏の型――経済・実務・婚姻',
    body: `蘇我稲目は536年、屯倉の籾を都に運ぶという財政実務からデビューした。武力ではなく経済・実務・婚姻という地味だが息の長い武器で勝負したのが蘇我氏の特徴である。

大伴氏（武力・外交）や物部氏（武力・祭祀）が武力に全振りして政変で脱落していったのに対し、蘇我氏だけがこの実務路線で生き残り、次の世代で天皇の外戚として絶頂を極めた。

この型はのちに藤原氏（中臣鎌足・不比等）にほぼそのまま継承される。稲目が発明し、馬子が完成させ、入鹿の代で武力による強引な手法に踏み込みすぎて自壊したパターンは、藤原氏が同じ轍を踏まないよう学習した反面教師になったとも読める。`
  },
  {
    id: 's2', category: '藤原氏',
    title: '有職故実というウルトラテクニック',
    body: `蘇我氏の権力の根拠は最後まで血統の濃さだった。血は殺せば消える――乙巳の変で入鹿を殺せば、蘇我の血の蓄積は一瞬でゼロになる。

対して藤原氏がやったのは「一度やったことを次から当たり前にする」という手口。良房の人身摂政も、一度やり遂げれば次の世代からは先例として継承されるだけになる。

有職故実は誰かを殺しても消せない。血統が殺せば終わる資産だとすれば、有職故実は積み上げるほど強くなる、物理的に破壊不可能な資産である。覇者がまず前例のないことをやり、その事実を後から由緒として権威化する――これが藤原氏の長期一強を支えた核心技術だった。`
  },
  {
    id: 's3', category: '乙巳の変',
    title: '中大兄皇子が23年間即位しなかった理由',
    body: `乙巳の変（645年）後、中大兄皇子はすぐには即位せず、称制という変則的な形で23年間、実務トップとして政務を執り続けた。

学説では年齢通念や間人皇女との関係が挙げられるが、崇峻天皇暗殺（592年、臣下が現職天皇を殺した唯一の例）を身内の歴史として見ていたはずの中大兄皇子にとって、天皇という座は「氏族に祭り上げられて簡単に排除されるリスクの高い椅子」でもあった。

邪魔者を先に排除し、氏族依存から脱却した強固な親政体制を先に作ってから即位する、という順序を踏んだ可能性がある。`
  },
  {
    id: 's4', category: '藤原氏',
    title: '持たざる者だからこそ――不比等と橘三千代',
    body: `藤原不比等は壬申の乱（672年）当時13歳で、近江朝廷側にも天武側にも属しようがない立場だったため粛清を免れた。父・鎌足は3年前に病没し、後ろ盾となる一族の勢力もすでに失っていた。

持たざる者だったからこそ、持統に一から育て上げられ、その恩義は100%持統個人に向かった。

橘三千代も同じ構造を持つ。県犬養氏という独自の権力基盤を持たない中小豪族出身だったからこそ、女帝たちにとって安全に信頼できる懐刀になれた。不比等と三千代は「持たざる者だからこそ全面依存し、全面的に信頼される」という同じパターンを男女それぞれの立場で体現したコンビだった。`
  }
];

async function loadEntries(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    entries = res && res.value ? JSON.parse(res.value) : seed;
  }catch(e){
    entries = seed;
  }
  render();
}

async function saveEntries(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false);
  }catch(e){
    console.error('保存に失敗しました', e);
  }
}

function getCategories(){
  const cats = new Set(entries.map(e => e.category));
  return ['すべて', ...Array.from(cats)];
}

function renderCats(){
  const catsEl = document.getElementById('cats');
  catsEl.innerHTML = '';
  getCategories().forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat === activeCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => { activeCat = cat; render(); };
    catsEl.appendChild(btn);
  });
}

function render(){
  renderCats();
  const q = document.getElementById('search').value.trim().toLowerCase();
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';

  let filtered = entries.filter(e => activeCat === 'すべて' || e.category === activeCat);
  if(q){
    filtered = filtered.filter(e =>
      e.title.toLowerCase().includes(q) ||
      e.body.toLowerCase().includes(q) ||
      e.category.toLowerCase().includes(q)
    );
  }

  if(filtered.length === 0){
    listEl.innerHTML = '<div class="empty">見つかりませんでした</div>';
    return;
  }

  filtered.forEach(e => {
    const div = document.createElement('div');
    div.className = 'entry';
    div.id = 'entry-' + e.id;
    div.innerHTML = `
      <div class="entry-head" onclick="toggleEntry('${e.id}')">
        <div class="entry-titles">
          <span class="entry-tag">${escapeHtml(e.category)}</span>
          <div class="entry-title">${escapeHtml(e.title)}</div>
          <div class="entry-preview">${escapeHtml(e.body.slice(0,40))}</div>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="entry-body">
        <div class="entry-text">${escapeHtml(e.body)}</div>
        <div class="entry-controls">
          <button class="ctl-btn" id="play-${e.id}" onclick="event.stopPropagation(); toggleSpeak('${e.id}')">▶ 読み上げ</button>
          <button class="ctl-btn" onclick="event.stopPropagation(); stopSpeak()">■ 停止</button>
          <button class="del-btn" onclick="event.stopPropagation(); deleteEntry('${e.id}')">削除</button>
        </div>
      </div>
    `;
    listEl.appendChild(div);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function toggleEntry(id){
  const el = document.getElementById('entry-' + id);
  el.classList.toggle('open');
}

function toggleSpeak(id){
  if(speakingId === id){
    stopSpeak();
    return;
  }
  stopSpeak();
  const entry = entries.find(e => e.id === id);
  if(!entry) return;
  const utter = new SpeechSynthesisUtterance(entry.title + '。' + entry.body);
  utter.lang = 'ja-JP';
  utter.rate = 1.0;
  utter.onend = () => {
    speakingId = null;
    updatePlayButtons();
  };
  currentUtterance = utter;
  speakingId = id;
  window.speechSynthesis.speak(utter);
  updatePlayButtons();
}

function stopSpeak(){
  window.speechSynthesis.cancel();
  speakingId = null;
  updatePlayButtons();
}

function updatePlayButtons(){
  document.querySelectorAll('.ctl-btn[id^="play-"]').forEach(btn => {
    const id = btn.id.replace('play-', '');
    if(id === speakingId){
      btn.textContent = '❚❚ 再生中';
      btn.classList.add('playing');
    }else{
      btn.textContent = '▶ 読み上げ';
      btn.classList.remove('playing');
    }
  });
}

async function deleteEntry(id){
  entries = entries.filter(e => e.id !== id);
  await saveEntries();
  render();
}

document.getElementById('search').addEventListener('input', render);

const modalBack = document.getElementById('modalBack');
document.getElementById('addBtn').onclick = () => {
  document.getElementById('m-cat').value = '';
  document.getElementById('m-title').value = '';
  document.getElementById('m-body').value = '';
  document.getElementById('status').textContent = '';
  modalBack.classList.add('show');
};
document.getElementById('cancelBtn').onclick = () => modalBack.classList.remove('show');
modalBack.onclick = (e) => { if(e.target === modalBack) modalBack.classList.remove('show'); };

document.getElementById('saveBtn').onclick = async () => {
  const cat = document.getElementById('m-cat').value.trim() || 'その他';
  const title = document.getElementById('m-title').value.trim();
  const body = document.getElementById('m-body').value.trim();
  const statusEl = document.getElementById('status');

  if(!title || !body){
    statusEl.textContent = 'タイトルと本文を入力してください';
    return;
  }

  statusEl.textContent = '保存中…';
  entries.unshift({ id: 'e' + Date.now(), category: cat, title, body });
  await saveEntries();
  statusEl.textContent = '保存しました';
  activeCat = cat;
  setTimeout(() => {
    modalBack.classList.remove('show');
    render();
  }, 400);
};

// ---- GitHub Raw markdown import ----

function cleanText(t){
  return t
    .replace(/\*\*/g, '')
    .replace(/^#+\s*/gm, '')
    .replace(/^-{3,}\s*$/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function parseMarkdown(md, defaultCategory){
  const result = [];
  // ## で始まる見出しでセクション分割（見出し自体も保持）
  const sectionRe = /^##\s+(.+)$/gm;
  let sections = [];
  let lastIndex = 0;
  let lastTitle = defaultCategory || 'インポート';
  let m;
  while((m = sectionRe.exec(md)) !== null){
    if(sections.length > 0 || lastIndex > 0){
      sections.push({ title: lastTitle, text: md.slice(lastIndex, m.index) });
    } else if(m.index > 0){
      // 最初の見出しより前に本文があれば、それも1セクションとして拾う
      const pre = md.slice(0, m.index).trim();
      if(pre) sections.push({ title: defaultCategory || 'はじめに', text: pre });
    }
    lastTitle = m[1].trim();
    lastIndex = sectionRe.lastIndex;
  }
  sections.push({ title: lastTitle, text: md.slice(lastIndex) });

  sections.forEach(sec => {
    const category = sec.title.replace(/^第[0-9０-９]+部\s*/, '').split('　')[0].split(' ')[0].trim() || (defaultCategory || 'インポート');
    // **Q. ... A. ... のペアで分割
    const qaRe = /\*\*Q\.\s*([\s\S]*?)\*\*\s*\n\s*A\.\s*([\s\S]*?)(?=\n\*\*Q\.|\n##\s|$)/g;
    let qm;
    let found = false;
    while((qm = qaRe.exec(sec.text)) !== null){
      found = true;
      const qText = cleanText(qm[1]);
      const aText = cleanText(qm[2]);
      const title = qText.length > 36 ? qText.slice(0,36) + '…' : qText;
      result.push({
        id: 'imp' + Date.now() + Math.random().toString(36).slice(2,7),
        category: category,
        title: title,
        body: 'Q. ' + qText + '\n\nA. ' + aText
      });
    }
    if(!found){
      const bodyText = cleanText(sec.text);
      if(bodyText.length > 15){
        result.push({
          id: 'imp' + Date.now() + Math.random().toString(36).slice(2,7),
          category: category,
          title: sec.title.replace(/^第[0-9０-９]+部\s*/, '').trim() || category,
          body: bodyText
        });
      }
    }
  });

  return result;
}

document.getElementById('importBtn').onclick = () => {
  document.getElementById('import-url').value = '';
  document.getElementById('importStatus').textContent = '';
  document.getElementById('importBack').classList.add('show');
};
document.getElementById('importCancelBtn').onclick = () => document.getElementById('importBack').classList.remove('show');
document.getElementById('importBack').onclick = (e) => {
  if(e.target === document.getElementById('importBack')) document.getElementById('importBack').classList.remove('show');
};

document.getElementById('importGoBtn').onclick = async () => {
  const url = document.getElementById('import-url').value.trim();
  const statusEl = document.getElementById('importStatus');
  if(!url){
    statusEl.textContent = 'URLを入力してください';
    return;
  }
  statusEl.textContent = '読み込み中…';
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error('取得に失敗しました（' + res.status + '）');
    const md = await res.text();
    const filename = url.split('/').pop().replace(/\.md$/, '');
    const parsed = parseMarkdown(md, filename);
    if(parsed.length === 0){
      statusEl.textContent = '見出しやQ&Aが見つかりませんでした';
      return;
    }
    entries = [...parsed, ...entries];
    await saveEntries();
    statusEl.textContent = parsed.length + '件、取り込みました';
    setTimeout(() => {
      document.getElementById('importBack').classList.remove('show');
      render();
    }, 600);
  }catch(e){
    statusEl.textContent = '読み込みエラー：' + e.message + '（GitHubがpublicリポジトリか確認してください）';
  }
};

loadEntries();
</script>
</body>
</html>
